# Production-style stack: PostgreSQL + application. Put a TLS reverse proxy (nginx / IIS / cloud LB) in front.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucfin
      POSTGRES_USER: ucfin_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucfin_app -d ucfin"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      UCF_ENVIRONMENT: production
      UCF_DATABASE_URL: postgresql+psycopg://ucfin_app:${DB_PASSWORD}@db:5432/ucfin
      UCF_SECRET_KEY: ${UCF_SECRET_KEY:?set UCF_SECRET_KEY in .env}
      UCF_ADMIN_PASSWORD: ${UCF_ADMIN_PASSWORD:-}
    volumes:
      - attachments:/data/attachments
    ports:
      - "8000:8000"
volumes:
  pgdata:
  attachments:
